
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム好きチャット</title>

    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>

    <!-- チャット画面全体 -->
    <div class="chat-container">

        <!-- ヘッダー -->
        <header class="chat-header">
            <h1>ゲーム好きチャット</h1>
        </header>

        <!-- 会話エリア -->
        <main class="chat-area">

            <!-- 相手のメッセージ -->
            <div class="message-left">
                <div class="bubble">
                    こんにちは！好きなゲームは何？
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="message-right">
                <div class="bubble">
                    こんにちは！僕はマインクラフトが好きだよ！
                </div>
            </div>

            <!-- 相手のメッセージ -->
            <div class="message-left">
                <div class="bubble">
                    マインクラフトいいね！どんな遊び方をするの？
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="message-right">
                <div class="bubble">
                    サバイバルモードで建築したり、洞窟を探検したりしているよ！
                </div>
            </div>

            <!-- 相手のメッセージ -->
            <div class="message-left">
                <div class="bubble">
                    すごいね！大きな建物を作ったことはある？
                </div>
            </div>

            <!-- 自分のメッセージ（長い文章） -->
            <div class="message-right">
                <div class="bubble">
                    あるよ！この前は大きなお城を作ったんだ。
                    材料を集めるのが大変だったけど、
                    完成したときはとても嬉しかったよ！
                    今度は街全体を作ってみたいと思っているよ！
                </div>
            </div>

        </main>

        <!-- 入力エリア -->
        <footer class="chat-input">
            <input type="text" placeholder="メッセージを入力...">
            <button>送信</button>
        </footer>

    </div>

</body>
</html>
