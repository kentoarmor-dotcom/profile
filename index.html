<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィールページのHTML</title>
    <!-- CSS/style.css を読み込む -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- ヘッダー（上のエリア） -->
    <header>
        <h1 class="profile-name">kennnosuke1107の自己紹介</h1>
        <nav>
            <a href="#favorite">好きなもの</a>
            <a href="#sports">好きなスポーツ</a>
            <a href="#schedule">予定表</a>
            <a href="#form">感想を送る</a>
        </nav>
    </header>

    <!-- 本文（メインエリア） -->
    <main>
        <p>栃木生まれの愛知育ち1年。スポーツが大好き</p>
        <img src="img/silhouette_human05_man.png" width="200" alt="プロフィール画像">

        <h2 id="favorite">好きなもの</h2>
        <ul>
            <li>ゲーム</li>
            <li>スポーツ</li>
            <li>映画</li>
        </ul>
        <p>スポーツは体を大きく動かすものが好きです。</p>
        <a href="https://www.youtube.com/">よく使うWeb</a><br>

        <h2 id="sports">好きなスポーツランキング</h2>
        <ol>
            <li>陸上</li>
            <li>水泳</li>
            <li>体操</li>
        </ol>

        <h2 id="schedule">予定表</h2>
        <table>
            <tr>
                <th>月曜日</th>
                <td>バイト</td>
            </tr>
            <tr>
                <th>水曜日</th>
                <td>バイト</td>
                <!-- ※見本の表の列数に合わせる場合、必要に応じて調整 -->
            </tr>
            <tr>
                <th>日曜日</th>
                <td>バイト</td>
            </tr>
        </table>

        <h2 id="form">このページの感想を送る</h2>
        <form method="get">
            <dl>
                <dt><label for="visitor-name">お名前</label></dt>
                <dd><input type="text" id="visitor-name" name="visitor-name"></dd>
                <dt>いちばんよかったところ</dt>
                <dd>
                    <label><input type="radio" name="best" value="photo">写真</label>
                    <label><input type="radio" name="best" value="list">好きなもの</label>
                    <label><input type="radio" name="best" value="table">予定の表</label>
                </dd>
                <dt><label for="comment">感想</label></dt>
                <dd><textarea id="comment" name="comment" rows="4"></textarea></dd>
            </dl>
            <button type="submit">送信する</button>
        </form>
    </main>

    <!-- フッター（下のエリア） -->
    <footer>
        <p>&copy; 2026 kennnosuke1107</p>
    </footer>

</body>
</html>
